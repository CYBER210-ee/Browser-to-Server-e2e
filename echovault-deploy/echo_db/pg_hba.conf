# EchoVault history DB — TLS only (D024).
# TYPE    DATABASE  USER  ADDRESS     METHOD
local     all       all               trust           # unix socket inside the container (healthcheck)
hostssl   all       all   0.0.0.0/0   scram-sha-256   # every TCP client must speak TLS
hostssl   all       all   ::/0        scram-sha-256
host      all       all   all         reject          # plain TCP is refused, not downgraded
