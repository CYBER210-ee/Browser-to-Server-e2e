# ── EchoVault: client · server · history database, no proxy ─────────────────
# Three containers on one Docker network. The browser talks to the client on
# :3000 and to the server on :8000 directly (plain http/ws — TLS in front of
# these is a deployment concern outside this compose). The database is
# included from echo_db/ so the same definition runs alone on another box.
#
#   ./echo_db/gen-db-certs.sh && cp echo_db/.env.example echo_db/.env   # edit password
#   (echo_server/.env: server keys + DATABASE_URL, see README)
#   docker compose up -d --build
include:
  - path: ./echo_db/docker-compose.yml

services:
  server:
    build: ./echo_server
    image: echo_server:2.0
    container_name: echo_server
    restart: unless-stopped
    env_file:
      - ./echo_server/.env         # SERVER_*_PRIVATE_KEY_HEX, DATABASE_URL, retention policy
    environment:
      DB_SSLROOTCERT: /app/certs/db-ca.crt
      EPOCH_DB_PATH: /data/epoch_keys.sqlite3
    volumes:
      - ./echo_db/certs/db-ca.crt:/app/certs/db-ca.crt:ro   # what verify-full trusts
      - epochkeys:/data            # sealed epoch keys stay on THIS host (D024)
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./echo_client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000   # baked into the bundle at build time
    image: echo_client:2.0
    container_name: echo_client
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  epochkeys:
